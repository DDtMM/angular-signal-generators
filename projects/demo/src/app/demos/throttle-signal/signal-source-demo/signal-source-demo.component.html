<div class="grid grid-cols-2 gap-3 text-center">
  <div class="rounded-lg bg-base-200 p-3">
    <div class="text-sm">Source signal</div>
    <div class="text-2xl font-bold">{{$source()}}</div>
  </div>
  <div class="rounded-lg bg-base-200 p-3">
    <div class="text-sm">Throttled signal</div>
    <div class="text-2xl font-bold text-primary">{{$throttled()}}</div>
  </div>
</div>
<button type="button" class="btn btn-primary mt-3" (click)="$source.update(value => value + 1)">
  Increment source
</button>
<p class="pt-3 text-sm">Click rapidly to see source changes limited to one published value per second.</p>
